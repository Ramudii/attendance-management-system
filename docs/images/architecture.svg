<svg xmlns="http://www.w3.org/2000/svg" width="1720" height="800" viewBox="0 0 1720 800" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111"/>
    </marker>
    <marker id="arrowSm" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111"/>
    </marker>
  </defs>

  <style>
    .box    { fill:#fff; stroke:#111; stroke-width:2.5; }
    .group  { fill:#fff; stroke:#111; stroke-width:2.5; }
    .icon   { fill:none; stroke:#111; stroke-width:2.2;
              stroke-linecap:round; stroke-linejoin:round; }
    .solid  { fill:#111; stroke:none; }
    .title  { font-size:33px; font-weight:700; letter-spacing:1px; text-anchor:middle; fill:#111; }
    .stage  { font-size:19px; font-weight:700; letter-spacing:0.6px; text-anchor:middle; fill:#111; }
    .head   { font-size:17px; font-weight:700; letter-spacing:0.4px; text-anchor:middle; fill:#111; }
    .body   { font-size:13px; text-anchor:middle; fill:#111; }
    .bullet { font-size:13.5px; text-anchor:start; fill:#111; }
    .loop   { font-size:15px; font-weight:700; letter-spacing:0.8px; text-anchor:middle; fill:#111; }
    .dash   { fill:none; stroke:#111; stroke-width:2; stroke-dasharray:8 7; }
  </style>

  <rect width="1720" height="800" fill="#fff"/>

  <text class="title" x="860" y="62">SAMS &#8211; STUDENT ATTENDANCE MANAGEMENT SYSTEM</text>

  <!-- ============ 1. DATA INPUTS ============ -->
  <rect class="box" x="30" y="170" width="240" height="380" rx="16"/>
  <text class="stage" x="150" y="215">1. DATA INPUTS</text>

  <!-- icon: signing sheet with grid + pen stroke -->
  <g class="icon" transform="translate(150,300)">
    <rect x="-40" y="-52" width="80" height="98" rx="5"/>
    <line x1="-40" y1="-30" x2="40" y2="-30"/>
    <line x1="-40" y1="-6" x2="40" y2="-6"/>
    <line x1="-40" y1="18" x2="40" y2="18"/>
    <line x1="-8" y1="-52" x2="-8" y2="46"/>
    <path d="M 4 12 q 8 -14 14 -2 t 14 -2"/>
    <path d="M 4 -12 q 8 -14 14 -2 t 14 -2"/>
  </g>

  <text class="bullet" x="42" y="410">&#8226;  Signing Sheet Photo</text>
  <text class="bullet" x="42" y="455">&#8226;  info.xml</text>
  <text class="bullet" x="62" y="478">(Student Records)</text>
  <text class="bullet" x="42" y="523">&#8226;  Five Sample Sheets</text>

  <line x1="278" y1="400" x2="322" y2="400" stroke="#111" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- ============ 2. IMAGE PROCESSING PIPELINE ============ -->
  <rect class="group" x="330" y="105" width="790" height="600" rx="20"/>
  <text class="stage" x="725" y="148">2. IMAGE PROCESSING PIPELINE</text>

  <!-- 2a GRAYSCALE -->
  <rect class="box" x="355" y="180" width="170" height="400" rx="14"/>
  <g transform="translate(440,245)">
    <rect class="icon" x="-33" y="-27" width="66" height="54" rx="5"/>
    <rect x="-32" y="-26" width="21" height="52" fill="#fff"/>
    <rect x="-11" y="-26" width="21" height="52" fill="#b3b3b3"/>
    <rect x="10" y="-26" width="22" height="52" fill="#111"/>
    <rect class="icon" x="-33" y="-27" width="66" height="54" rx="5"/>
  </g>
  <text class="head" x="440" y="330">GRAYSCALE</text>
  <text class="body" x="440" y="380">Converts the colour</text>
  <text class="body" x="440" y="402">photo into a single</text>
  <text class="body" x="440" y="424">intensity channel.</text>

  <!-- 2b BINARIZATION -->
  <rect class="box" x="545" y="180" width="170" height="400" rx="14"/>
  <g transform="translate(630,245)">
    <line class="icon" x1="-34" y1="28" x2="34" y2="28"/>
    <rect class="solid" x="-30" y="6" width="9" height="22"/>
    <rect class="solid" x="-18" y="-8" width="9" height="36"/>
    <rect class="solid" x="-6" y="-24" width="9" height="52"/>
    <rect class="solid" x="6" y="-12" width="9" height="40"/>
    <rect class="solid" x="18" y="2" width="9" height="26"/>
    <line x1="0" y1="-34" x2="0" y2="36" stroke="#111" stroke-width="2.4" stroke-dasharray="6 5"/>
  </g>
  <text class="head" x="630" y="330">BINARIZATION</text>
  <text class="body" x="630" y="380">Otsu and adaptive</text>
  <text class="body" x="630" y="402">thresholding separate</text>
  <text class="body" x="630" y="424">ink from paper.</text>

  <!-- 2c NOISE REMOVAL -->
  <rect class="box" x="735" y="180" width="170" height="400" rx="14"/>
  <g transform="translate(820,245)">
    <rect class="icon" x="-33" y="-30" width="66" height="60" rx="5"/>
    <circle class="solid" cx="-20" cy="-16" r="3.2"/>
    <circle class="solid" cx="-6" cy="-22" r="2.4"/>
    <circle class="solid" cx="-14" cy="-2" r="2.6"/>
    <circle class="solid" cx="-24" cy="12" r="2.2"/>
    <circle class="solid" cx="-4" cy="8" r="3"/>
    <path class="icon" d="M 6 -26 L 30 -2" stroke-width="2.6"/>
    <path class="icon" d="M 18 22 l 3 -8 l 8 -3 l -8 -3 l -3 -8 l -3 8 l -8 3 l 8 3 z"/>
  </g>
  <text class="head" x="820" y="330">NOISE</text>
  <text class="head" x="820" y="352">REMOVAL</text>
  <text class="body" x="820" y="392">Median filtering</text>
  <text class="body" x="820" y="414">clears camera</text>
  <text class="body" x="820" y="436">specks and artefacts.</text>

  <!-- 2d CELL EXTRACTION -->
  <rect class="box" x="925" y="180" width="170" height="400" rx="14"/>
  <g transform="translate(1010,245)">
    <rect class="icon" x="-36" y="-27" width="72" height="54" rx="4"/>
    <line class="icon" x1="-36" y1="-9" x2="36" y2="-9"/>
    <line class="icon" x1="-36" y1="9" x2="36" y2="9"/>
    <line class="icon" x1="-12" y1="-27" x2="-12" y2="27"/>
    <line class="icon" x1="12" y1="-27" x2="12" y2="27"/>
    <rect x="12" y="9" width="24" height="18" fill="#111" opacity="0.16"/>
    <rect x="12" y="9" width="24" height="18" fill="none" stroke="#111" stroke-width="3.4"/>
  </g>
  <text class="head" x="1010" y="330">CELL</text>
  <text class="head" x="1010" y="352">EXTRACTION</text>
  <text class="body" x="1010" y="392">Detects table grid</text>
  <text class="body" x="1010" y="414">lines and crops each</text>
  <text class="body" x="1010" y="436">signature cell.</text>

  <!-- feedback / progress capture -->
  <path class="dash" d="M 440 640 H 1010"/>
  <line class="dash" x1="440" y1="640" x2="440" y2="592" marker-end="url(#arrowSm)"/>
  <line class="dash" x1="630" y1="640" x2="630" y2="592" marker-end="url(#arrowSm)"/>
  <line class="dash" x1="820" y1="640" x2="820" y2="592" marker-end="url(#arrowSm)"/>
  <line class="dash" x1="1010" y1="640" x2="1010" y2="592" marker-end="url(#arrowSm)"/>
  <text class="loop" x="725" y="676">EVERY STAGE SAVED AS A PROGRESS IMAGE</text>

  <line x1="1128" y1="400" x2="1172" y2="400" stroke="#111" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- ============ 3. RECOGNITION & MAPPING ============ -->
  <rect class="box" x="1180" y="150" width="235" height="450" rx="16"/>
  <text class="stage" x="1297" y="196">3. RECOGNITION</text>
  <text class="stage" x="1297" y="221">&amp; MAPPING</text>

  <!-- speech bubble = OCR -->
  <g class="icon" transform="translate(1240,275)">
    <path d="M -30 -24 h 60 a 5 5 0 0 1 5 5 v 34 a 5 5 0 0 1 -5 5 h -40 l -14 13 v -13 h -6 a 5 5 0 0 1 -5 -5 v -34 a 5 5 0 0 1 5 -5 z"/>
    <line x1="-20" y1="-11" x2="22" y2="-11"/>
    <line x1="-20" y1="0" x2="22" y2="0"/>
    <line x1="-20" y1="11" x2="8" y2="11"/>
  </g>
  <text class="bullet" x="1200" y="345">Tesseract OCR reads the</text>
  <text class="bullet" x="1200" y="367">student index from every</text>
  <text class="bullet" x="1200" y="389">row of the sheet.</text>

  <!-- clipboard = present / absent -->
  <g class="icon" transform="translate(1240,460)">
    <rect x="-27" y="-30" width="54" height="66" rx="5"/>
    <rect x="-11" y="-38" width="22" height="15" rx="3"/>
    <rect x="-19" y="-16" width="10" height="10" rx="2"/>
    <path d="M -17 -11 l 3 3 l 5 -6"/>
    <line x1="-4" y1="-11" x2="19" y2="-11"/>
    <rect x="-19" y="2" width="10" height="10" rx="2"/>
    <path d="M -17 7 l 3 3 l 5 -6"/>
    <line x1="-4" y1="7" x2="19" y2="7"/>
    <rect x="-19" y="20" width="10" height="10" rx="2"/>
    <line x1="-4" y1="25" x2="19" y2="25"/>
  </g>
  <text class="bullet" x="1200" y="540">Signature detector marks</text>
  <text class="bullet" x="1200" y="562">each cell present or absent.</text>

  <line x1="1423" y1="400" x2="1467" y2="400" stroke="#111" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- ============ 4. OUTPUT ============ -->
  <rect class="box" x="1475" y="170" width="215" height="380" rx="16"/>
  <text class="stage" x="1582" y="215">4. OUTPUT</text>

  <!-- monitor with rising chart -->
  <g class="icon" transform="translate(1582,285)">
    <rect x="-45" y="-38" width="90" height="62" rx="5"/>
    <path d="M -32 12 L -14 -8 L -2 2 L 20 -24"/>
    <path d="M 8 -24 h 12 v 12"/>
    <line x1="0" y1="24" x2="0" y2="36"/>
    <line x1="-18" y1="36" x2="18" y2="36"/>
  </g>

  <text class="body" x="1582" y="352" font-weight="700">Attendance Record</text>

  <rect class="box" x="1502" y="368" width="160" height="42" rx="8"/>
  <text class="body" x="1582" y="395" font-weight="700" font-size="15">SQLITE DB</text>

  <text class="bullet" x="1497" y="450">&#8226;  Present / Absent</text>
  <text class="bullet" x="1497" y="482">&#8226;  Attendance Rate</text>
  <text class="bullet" x="1497" y="514">&#8226;  Summary Charts</text>

</svg>
